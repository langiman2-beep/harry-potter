<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/main.min.css" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>
  <body>
    <section class="main-screen">
      <h1 class="main-screen__title">Ласкаво просимо у світ Гаррі Поттера</h1>
      <button class="main-screen__btn">Показати всіх персонажів</button>
    </section>
    <!-- Друга секція: Вибір категорій (Блок: categories) -->
    <section class="categories">
      <div class="categories__container">
        <div class="categories__list">
          <!-- Карточка 1: Студенти (Елемент: categories__item) -->
          <div class="categories__item">
            <img
              class="categories__img"
              src="images/cat-students.png"
              alt="Студенти"
            />
            <a class="categories__link" href="students.html"
              >Студенти Гоґвортсу</a
            >
          </div>
          <!-- Карточка 2: Співробітники -->
          <div class="categories__item">
            <img
              class="categories__img"
              src="images/cat-staff.png"
              alt="Співробітники"
            />
            <a class="categories__link" href="staff.html"
              >Співробітники Гоґвортсу</a
            >
          </div>
          <!-- Карточка 3: Факультети -->
          <div class="categories__item">
            <img
              class="categories__img"
              src="images/cat-houses.png"
              alt="Будинки"
            />
            <a class="categories__link" href="houses.html"
              >Персонажі в певному будинку</a
            >
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>
